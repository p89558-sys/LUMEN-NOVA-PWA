<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6046a5"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>NOVA｜四星彩</title></head><body><header><small>NOVA4S</small><h1>NOVA｜四星彩</h1><p>SUBNOVA｜四星彩</p></header><main><nav><button data-tab="pick">選號</button><button data-tab="history">候選紀錄</button><button data-tab="draws">開獎／對獎</button><button data-tab="backup">備份</button></nav><section id="pick"><h2>產生兩組候選</h2><button id="gen">產生號碼</button> <button id="save">保存候選</button><div id="current"></div><p class="notice">隨機候選不代表能預測開獎或提高中獎機率。</p></section><section id="history" hidden><h2>候選紀錄</h2><button id="csv">匯出候選 CSV</button><div id="hist"></div></section><section id="draws" hidden><h2>歷史開獎與對獎</h2><p>請匯入已核對來源的 CSV；此版不會假稱已連線官方資料。</p><input id="drawfile" type="file" accept=".csv"><button id="drawcsv">匯出開獎 CSV</button><div id="drawlist"></div></section><section id="backup" hidden><h2>資料備份</h2><button id="export">匯出完整 JSON</button><input id="restore" type="file" accept=".json"><p>備份僅能在相同 App 還原。不同裝置不會自動同步。</p></section></main><footer>Prototype v0.1 · 本機儲存</footer><script src="app.js"></script></body></html>
